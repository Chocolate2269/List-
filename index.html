<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Receipt</title>
<style>body{margin:0;background:#d0d0d0;font-family:Arial}.receipt{max-width:700px;margin:20px auto;background:#fff;padding:30px;border-top:8px solid #C69C3A}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px}th{background:#0A1931;color:#fff;padding:11px 6px;text-align:left}td{border:1px solid #ccc;padding:11px 6px}td[contenteditable]{background:#fffef0}td[contenteditable]:focus{background:#ffe78a;outline:none}.total{margin-top:15px;background:#0A1931;color:#fff;padding:12px;text-align:right;font-weight:900}</style></head><body>
<div class="receipt">
<h2 style="text-align:center">PAYMENT RECEIPT - Amount To Receive</h2>
<p style="text-align:center;background:#fdf3d0;padding:8px">Platform: <b contenteditable="true">BINANCE</b> | Receipt: <b contenteditable="true">SPF-2026-0010</b></p>
<table id="t"><tr><th>#</th><th>Names</th><th>Country</th><th>Amount To Receive ($)</th></tr>
<tr><td>1</td><td contenteditable="true"></td><td contenteditable="true">$ 0.00</td></tr>
<tr><td>2</td><td contenteditable="true"></td><td contenteditable="true">$ 0.00</td></tr>
<tr><td>3</td><td contenteditable="true"></td><td contenteditable="true">$ 0.00</td></tr>
<tr><td>4</td><td contenteditable="true"></td><td contenteditable="true">$ 0.00</td></tr>
<tr><td>5</td><td contenteditable="true"></td><td contenteditable="true">$ 0.00</td></tr>
</table>
<div class="total">TOTAL AMOUNT TO RECEIVE: $ <span contenteditable="true">0.00</span></div>
<br><button onclick="window.print()" style="padding:10px 18px;background:#0A1931;color:#fff;border:0;border-radius:5px">Print / PDF</button>
</div>

<script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=PuuL5XeirbvW"></script>
<script>
function forceChatwayOpen(){
  if(window.Chatway && window.Chatway.show) window.Chatway.show();
  document.querySelectorAll('div,button,iframe').forEach(el=>{
    if(el.id && el.id.toLowerCase().includes('chatway')) el.click();
    if(el.className && el.className.toString().toLowerCase().includes('chatway')) el.click();
  });
}
window.addEventListener('load',()=>{
  setTimeout(forceChatwayOpen,1500);
  setTimeout(forceChatwayOpen,3000);
  let c=0; let iv=setInterval(()=>{forceChatwayOpen(); c++; if(c>10) clearInterval(iv);},1000);
});
</script>
</body></html>
